<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>
        {% block title %}
        Paradise Resort
        {% endblock %}
    </title>

    {% load static %}

    <link rel="stylesheet"
          href="{% static 'css/style.css' %}">

</head>

<body>

<header>

    <div class="navbar">

        <div class="logo">
            Paradise Resort
        </div>

        <nav>

            <a href="{% url 'home' %}">
                Home
            </a>

            <a href="{% url 'rooms' %}">
                Rooms
            </a>

            <a href="{% url 'booking' %}">
                Book Now
            </a>

        </nav>

    </div>

</header>


{% if messages %}

    <div class="messages">

        {% for message in messages %}

            <div class="message">
                {{ message }}
            </div>

        {% endfor %}

    </div>

{% endif %}


<main>

    {% block content %}

    {% endblock %}

</main>


<footer>

    <p>
        © 2026 Paradise Resort |
        Pre Resort Booking System
    </p>

</footer>

</body>

</html>
